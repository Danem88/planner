<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="description" content="Tareas, horario, exámenes y notas de clase.">
<meta name="theme-color" content="#FBF6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Modo de color antes de pintar, para que no parpadee.
  try { const t = JSON.parse(localStorage.getItem('bea.theme') || '"auto"'); if (t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  try { const a = localStorage.getItem('bea.accent'); if (a && a !== 'rosa') document.documentElement.dataset.accent = a; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <button id="fab" class="fab" aria-label="Añadir"><svg class="i"><use href="#i-plus"/></svg></button>
  <nav id="tabbar" class="tabbar" aria-label="Secciones">
    <a href="#hoy" data-tab="hoy"><svg class="i"><use href="#i-hoy"/></svg><span>Hoy</span></a>
    <a href="#horario" data-tab="horario"><svg class="i"><use href="#i-hor"/></svg><span>Horario</span></a>
    <a href="#fechas" data-tab="fechas"><svg class="i"><use href="#i-fec"/></svg><span>Fechas</span></a>
    <a href="#notas" data-tab="notas"><svg class="i"><use href="#i-not"/></svg><span>Notas</span></a>
    <a href="#materias" data-tab="materias"><svg class="i"><use href="#i-asi"/></svg><span>Materias</span></a>
  </nav>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
